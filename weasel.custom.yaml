pinin_light:
  pl_mark: &pl_mark 0x0067C0
  pl_label: &pl_label 0x4C566A
  pl_text: &pl_text 0x2E3440
  pl_back: &pl_back 0xF9F9F9
  pl_border: &pl_border 0xEFEFEF
  pl_hlabel: &pl_hlabel 0xCAC9C8
  pl_htext: &pl_htext 0xFFFFFF
  pl_hback: &pl_hback 0xF0F0F0

pinin_dark:
  pd_mark: &pd_mark 0x4CC2FF
  pd_label: &pd_label 0xBBBBBB
  pd_text: &pd_text 0xEEEEEE
  pd_back: &pd_back 0x2C2C2C
  pd_border: &pd_border 0xC9C9C9
  pd_hlabel: &pd_hlabel 0x4C4C4C
  pd_htext: &pd_htext 0x000000
  pd_hback: &pd_hback 0x383838

patch:
  # [style]
  # 字体；候选项、候选窗口的行为、布局及样式
  style/color_scheme: pinin_dark # 默认配色方案
  style/color_scheme_dark: pinin_dark # 深色模式

  # 全局字体
  style/font_face: "LXGW WenKai, Segoe UI Emoji:23:23, Segoe UI Emoji:2a:2a, Segoe UI Emoji:30:39, Segoe UI Emoji:fe0f:fe0f, Segoe UI Emoji:20e3:20e3, Segoe UI, Microsoft YaHei, DengXian, Segoe UI Emoji, Noto Color Emoji, Segoe UI Symbol"
  style/label_format: "" # 标签字符：例如 %s. 效果为 1. 2. 3. ....

  # [preset_color_schemes]
  # 配色设定
  preset_color_schemes/pinin_light:
    name: "Pinin_light"
    author: ASneka
    color_format: rgba
    label_color: *pl_label
    candidate_text_color: *pl_text
    comment_text_color: *pl_text
    back_color: *pl_back
    border_color: *pl_hback
    hilited_label_color: *pl_hlabel
    hilited_candidate_text_color: *pl_htext
    hilited_comment_text_color: *pl_htext
    hilited_candidate_back_color: *pl_mark

  preset_color_schemes/pinin_dark:
    name: "Pinin_dark"
    author: ASneka
    color_format: rgba
    label_color: *pd_label
    candidate_text_color: *pd_text
    comment_text_color: *pd_text
    back_color: *pd_back
    border_color: *pd_hback
    hilited_label_color: *pd_hlabel
    hilited_candidate_text_color: *pd_htext
    hilited_comment_text_color: *pd_htext
    hilited_candidate_back_color: *pd_mark

  # 薄荷拼音的配色方案
  preset_color_schemes/mint_light_blue:
    name: "蓝水鸭／Mint Light Blue"
    author: Mintimate <"Mintimate's Blog">
    # 拼音串
    text_color: 0x6495ed
    # 背景
    back_color: 0xefefef
    # 预选栏编号颜色
    label_color: 0xcac9c8
    # 边框
    border_color: 0xefefef
    shadow_color: 0xb4000000
    # 注解文字
    comment_text_color: 0xcac9c8
    # 非第一候选项
    candidate_text_color: 0x424242
    # 拼音串高亮
    hilited_text_color: 0xed9564
    # 拼音串高亮背景
    hilited_back_color: 0xefefef
    # 第一候选项背景
    hilited_candidate_back_color: 0xed9564
    # 第一候选项
    hilited_candidate_text_color: 0xefefef
    # 第一候选项编号颜色
    hilited_candidate_label_color: 0xcac9c8
    # 第一候选项编号颜色
    hilited_label_color: 0xcac9c8
    # 注解文字高亮
    hilited_comment_text_color: 0xefefef

  preset_color_schemes/mint_dark_blue:
    name: "黑水鸭／Mint Dark Blue"
    author: Mintimate <"Mintimate's Blog">
    # 拼音串
    text_color: 0x6495ed
    # 背景
    back_color: 0x424242
    # 预选栏编号颜色
    label_color: 0xefefef
    # 边框
    border_color: 0x424242
    shadow_color: 0xb4000000
    # 注解文字
    comment_text_color: 0xefefef
    # 非第一候选项
    candidate_text_color: 0xefefef
    # 拼音串高亮
    hilited_text_color: 0xc6c01a
    # 拼音串高亮背景
    hilited_back_color: 0x424242
    # 第一候选项背景
    hilited_candidate_back_color: 0xc6c01a
    # 第一候选项
    hilited_candidate_text_color: 0xefefef
    # 第一候选项编号颜色
    hilited_candidate_label_color: 0xffffff
    # 第一候选项编号颜色
    hilited_label_color: 0xffffff
    # 注解文字高亮
    hilited_comment_text_color: 0xffffff
