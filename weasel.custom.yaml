patch:
  # [style]
  # 字体；候选项、候选窗口的行为、布局及样式
  style/color_scheme: mspy_light # 默认配色方案
  style/color_scheme_dark: mspy_dark # 深色模式

  # 全局字体
  style/font_face: "LXGW WenKai, Segoe UI Emoji:23:23, Segoe UI Emoji:2a:2a, Segoe UI Emoji:30:39, Segoe UI Emoji:fe0f:fe0f, Segoe UI Emoji:20e3:20e3, Segoe UI, Microsoft YaHei, DengXian, Segoe UI Emoji, Noto Color Emoji, Segoe UI Symbol"
  style/label_format: "" # 标签字符：例如 %s. 效果为 1. 2. 3. ....

  # [preset_color_schemes]
  # 配色设定
  preset_color_schemes/mspy_light:
    name: "微软拼音浅色／mspy_light"
    author: ASneka
    color_format: rgba
    # hilited_mark_color: 0x0067C0
    hilited_label_color: 0xcac9c8
    hilited_candidate_text_color: 0xFFFFFF
    hilited_comment_text_color: 0xFFFFFF
    label_color: 0x4C566A
    candidate_text_color: 0x2E3440
    comment_text_color: 0x2E3440
    hilited_candidate_back_color: 0x0067C0
    back_color: 0xF9F9F9
    border_color: 0xF0F0F0

  preset_color_schemes/mspy_dark:
    name: "微软拼音深色／mspy_dark"
    author: ASneka
    color_format: rgba
    # hilited_mark_color: 0x4CC2FF
    hilited_label_color: 0x4C4C4C
    hilited_candidate_text_color: 0x000000
    hilited_comment_text_color: 0x000000
    label_color: 0xBBBBBB
    candidate_text_color: 0xEEEEEE
    comment_text_color: 0xEEEEEE
    hilited_candidate_back_color: 0x4CC2FF
    back_color: 0x2C2C2C
    border_color: 0x383838

  # 薄荷拼音的配色方案
  preset_color_schemes/mint_light_blue:
    name: "蓝水鸭／Mint Light Blue"
    author: Mintimate <"Mintimate's Blog">
    # 拼音串
    text_color: 0x6495ed
    # 背景
    back_color: 0xefefef
    # 预选栏编号颜色
    label_color: 0xcac9c8
    # 边框
    border_color: 0xefefef
    shadow_color: 0xb4000000
    # 注解文字
    comment_text_color: 0xcac9c8
    # 非第一候选项
    candidate_text_color: 0x424242
    # 拼音串高亮
    hilited_text_color: 0xed9564
    # 拼音串高亮背景
    hilited_back_color: 0xefefef
    # 第一候选项背景
    hilited_candidate_back_color: 0xed9564
    # 第一候选项
    hilited_candidate_text_color: 0xefefef
    # 第一候选项编号颜色
    hilited_candidate_label_color: 0xcac9c8
    # 第一候选项编号颜色
    hilited_label_color: 0xcac9c8
    # 注解文字高亮
    hilited_comment_text_color: 0xefefef

  preset_color_schemes/mint_dark_blue:
    name: "黑水鸭／Mint Dark Blue"
    author: Mintimate <"Mintimate's Blog">
    # 拼音串
    text_color: 0x6495ed
    # 背景
    back_color: 0x424242
    # 预选栏编号颜色
    label_color: 0xefefef
    # 边框
    border_color: 0x424242
    shadow_color: 0xb4000000
    # 注解文字
    comment_text_color: 0xefefef
    # 非第一候选项
    candidate_text_color: 0xefefef
    # 拼音串高亮
    hilited_text_color: 0xc6c01a
    # 拼音串高亮背景
    hilited_back_color: 0x424242
    # 第一候选项背景
    hilited_candidate_back_color: 0xc6c01a
    # 第一候选项
    hilited_candidate_text_color: 0xefefef
    # 第一候选项编号颜色
    hilited_candidate_label_color: 0xffffff
    # 第一候选项编号颜色
    hilited_label_color: 0xffffff
    # 注解文字高亮
    hilited_comment_text_color: 0xffffff
