patch:
  # 方案列表
  schema_list:
    - schema: rime_ice
    - schema: kagiroi

  menu/page_size: 3 # 候选词个数

  # 方案选单相关
  switcher/hotkeys:
    - F4
  # 开关记忆（方案中的 switches），从方案选单（而非快捷键）切换时会记住的选项，需要记忆的开关不能设定 reset
  # 部分前端（如小企鹅），实现了全局状态，切换后在任何焦点都会记住；
  # 部分前端（如鼠须管），仅在当前会话中记住，每个App或一个App的不同输入框都会单独管理；
  # 部分前端（如小狼毫），仅实现了中英全局状态，其他开关仍然是单独管理。
  switcher/save_options:
    - ascii_punct
    - traditionalization
    - full_shape
    - search_single_char
    # カギロイ多出来的方案选单
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  switcher/fold_options: true # 呼出时是否折叠

  # 快捷键patch:
  key_binder/bindings/@0/send: Up
  key_binder/bindings/@1/send: Down
