patch:
  # 方案列表
  schema_list:
    - schema: pinin
    - schema: kagiroi

  menu/page_size: 3 # 候选词个数

  # 方案选单相关
  switcher/hotkeys:
    - F4
  # 开关记忆（方案中的 switches），从方案选单（而非快捷键）切换时会记住的选项，需要记忆的开关不能设定 reset
  # 部分前端（如小企鹅），实现了全局状态，切换后在任何焦点都会记住；
  # 部分前端（如鼠须管），仅在当前会话中记住，每个App或一个App的不同输入框都会单独管理；
  # 部分前端（如小狼毫），仅实现了中英全局状态，其他开关仍然是单独管理。
  switcher/save_options:
    - ascii_punct
    - traditionalization
    - full_shape
    - search_single_char
    # カギロイ多出来的方案选单
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  switcher/fold_options: true # 呼出时是否折叠

  # 标点符号
  # 设置为一个映射，就自动上屏；设置为多个映射，如 '/' : [ '/', ÷ ] 则进行复选。
  #   full_shape: 全角没改，使用预设值
  #   half_shape: 标点符号全部直接上屏，和 macOS 自带输入法的区别是
  #              '|' 是半角的，
  #              '~' 是半角的。
  punctuator/digit_separators: ",:"  # 在此处指定的字符，在数字后被输入，若再次输入数字，则连同数字直接上屏；若双击，则恢复映射。 # librime >= 1.13.0
  punctuator/half_shape/.: null

  # 快捷键patch:
  key_binder/bindings/@0/send: Up
  key_binder/bindings/@1/send: Down
