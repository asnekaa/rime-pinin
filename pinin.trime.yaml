tool_bar:
  button_spacing: 5 # 按钮间距
  button_font: iconfont.ttf # 按钮字体
  back_style: "ic@arrow-left" # 左侧返回按钮样式

  # 左侧固定主按钮配置
  primary_button:
    # size: [120, 24]      # 视图组件整体宽高 (支持: -1: 填充(matchParent), -2: 自适应(wrapContent))
    # 背景样式设置
    background:
      type: circle # 高亮形状 (可选值: circle|rectangle)
      corner_radius: 10 # 圆角半径
      normal: 0x00 # 正常状态背景颜色
      highlight: hilited_candidate_button_color # 高亮状态背景色
      vertical_inset: 4 # 垂直方向内缩量
      horizontal_inset: 4 # 水平方向内缩量
    # 前景内容设置
    foreground:
      style: "ic@dots_horizontal" # 内置质感设计图标样式（以ic@开头）
      normal: candidate_text_color # 正常状态前景色 (本地图片不允许着色)
      # highlight:        # 高亮状态前景色
      padding: 10 # 前景内容与背景边界的内边距
    # 按钮点击事件
    action: menu_keyboard
    long_press_action: Settings

  hide_button: &hide_button
    foreground:
      style: "ic@keyboard_close"
      normal: candidate_text_color
    action: Hide

  emoji_button: &emoji_button
    foreground:
      style: "ic@emoticon"
    # 前景样式可以为空，使用默认样式，按钮将显示为 action 的 label
    action: liquid_keyboard_emoji

  clipboard_button: &clipboard_button
    foreground:
      style: "ic@clipboard"
    action: clipboard_window

  edit_button: &edit_button
    foreground:
      style: "ic@cursor_text"
    action: Keyboard_editor

  ascii_mode_button: &ascii_mode_button
    foreground:
      option_styles: ["中", "En"] # 样式也可以为表，将根据 action 的 toggle 决定
      font_size: 18 # 按钮字体大小
      padding: 10
    action: Mode_switch

  full_shape_button: &full_shape_button
    foreground:
      option_styles: ["ic@moon_full", "ic@moon_new"]
    action: Zenkaku_Hankaku

  # 右侧按钮列表（从右向左排列）
  buttons:
    [
      *hide_button,
      *emoji_button,
      *clipboard_button,
      *edit_button,
      *ascii_mode_button,
      *full_shape_button,
    ]

preset_keys:
  # 工具栏
  undo: { label: ic@undo, send: Control+z }
  redo: { label: ic@redo, send: Control+Shift+z }
  Hide: { send: BACK }
  # 編輯
  Shift_L: { label: ic@apple_keyboard_shift, preview: "", send: Shift_L }
  Shift_L2: { label: ic@apple_keyboard_caps, send: Eisu_toggle, select: caps }
  BackSpace: { label: ⌫, preview: "", repeatable: true, send: BackSpace }
  BackSpace_word: { label: ⇦, send: Control+BackSpace }
  Delete: { label: ⌦, send: Delete }
  space:
    {
      label: "ic@keyboard_space",
      preview: "",
      repeatable: false,
      slide_cursor: true,
      functional: false,
      send: space,
    }
  Return: { label: ic@keyboard_return, preview: "", send: Return }
  Return1: { label: ↩, send: Return }
  Return2: { label: 回车, send: Return }
  space1: { label: 空格, repeatable: false, functional: false, send: space }
  Tab: { label: ic@keyboard_tab, send: Tab }
  Left: { label: "←", send: Left }
  Down: { label: "↓", send: Down }
  Up: { label: "↑", send: Up }
  Right: { label: "→", send: Right }
  select_all: { label: ic@select_all, send: Control+a }
  cut: { label: ic@content_cut, send: Control+x }
  copy: { label: ic@content_copy, send: Control+c }
  paste: { label: ic@content_paste, send: Control+v }
  # rime組合鍵
  F4: { label: 方案選單, send: F4 }
  BackToPreviousSyllable: { label: 刪音節, send: Control+BackSpace }
  CommitRawInput: { label: 編碼, send: Control+Return }
  CommitScriptText: { label: 編碼, send: Shift+Return }
  CommitComment: { label: 編碼, send: Control+Shift+Return }
  DeleteCandidate: { label: 刪詞, send: Control+Delete }
  # rime狀態
  Mode_switch:
    { toggle: ascii_mode, send: SWITCH_CHARSET, states: [中文, 西文] }
  Zenkaku_Hankaku:
    { toggle: full_shape, send: SWITCH_CHARSET, states: [半角, 全角] }
  Henkan: { toggle: simplification, send: SWITCH_CHARSET, states: [漢字, 汉字] }
  Charset_switch:
    { toggle: extended_charset, send: SWITCH_CHARSET, states: [常用, 增廣] }
  Punct_switch:
    { toggle: ascii_punct, send: SWITCH_CHARSET, states: [。，, ．，] }
  #切换键盘
  Keyboard_number: { label: ic@numeric, send: Eisu_toggle, select: number }
  Keyboard_mini: { label: 迷你, send: Eisu_toggle, select: mini }
  Keyboard_letter: { label: 字母, send: Eisu_toggle, select: default }
  Keyboard_default: { label: 返回, send: Eisu_toggle, select: .default }
  Keyboard_switch: { label: 鍵盤, send: Eisu_toggle, select: .next }
  liquid_keyboard_switch:
    { label: 更多, send: FUNCTION, command: liquid_keyboard, option: "更多" }
  liquid_keyboard_exit: {
      label: 返回,
      send: FUNCTION,
      command: liquid_keyboard,
      option: "-1",
    } #退出liquidkeyboard
  liquid_keyboard_emoji:
    { label: 🙂, send: FUNCTION, command: liquid_keyboard, option: "emoji" }
  clipboard_window: {
      label: "剪贴",
      send: FUNCTION,
      command: "clipboard_window",
      option: "0",
    } #0剪贴板，1收藏夹
  set_color_ink:
    {
      label: 切换到ink配色,
      send: FUNCTION,
      command: set_color_scheme,
      option: "ink",
    }
  set_theme_ink: {
      label: 切换到ink主题,
      send: FUNCTION,
      command: set_theme,
      option: "ink",
    } #空参数为刷新主题
  # trime設定
  IME_switch: { label: 🌐, send: LANGUAGE_SWITCH } #彈出對話框選擇輸入法
  IME_last: { label: 上一輸入法, send: LANGUAGE_SWITCH, select: .last } #直接切換到上一輸入法
  IME_next: { label: 下一輸入法, send: LANGUAGE_SWITCH, select: .next } #直接切換到下一輸入法
  Schema_switch: { label: 下一方案, send: Control+Shift+1 }
  one_hand_switch_1:
    { toggle: _one_hand_mode_1, send: SWITCH_CHARSET, states: [左手, 普通] }
  one_hand_switch_2:
    { toggle: _one_hand_mode_2, send: SWITCH_CHARSET, states: [右手, 普通] }
  one_hand_switch_3:
    { toggle: _one_hand_mode_3, send: SWITCH_CHARSET, states: [左手, 右手] }
  Color_switch: { label: 配色, send: PROG_RED }
  Help: { label: 說明, send: HELP }
  Info: { label: 關於, send: INFO }
  Menu: { label: 方案, send: MENU }
  Settings: { label: 設定, send: SETTINGS }
  Color_settings: { label: 配色, send: SETTINGS, option: "color" }
  Theme_settings: { label: 主題, send: SETTINGS, option: "theme" }
  Schema_settings: { label: 方案, send: SETTINGS, option: "schema" }
  Candidate_switch:
    { toggle: _hide_candidate, send: SWITCH_CHARSET, states: [有候選, 無候選] }
  Comment_switch:
    { toggle: _hide_comment, send: SWITCH_CHARSET, states: [有註釋, 無註釋] }
  Hint_switch:
    { toggle: _hide_key_hint, send: SWITCH_CHARSET, states: [有助記, 無助記] }
  # trime命令
  Date: { label: 日期, command: date, option: "yyyy-MM-dd" }
  ChineseDate: { label: 農曆, command: date, option: "zh_CN@calendar=chinese" } #農曆等日期(>=Android 7.0)：date 語言@calendar=曆法 格式。具體參見https://developer.android.com/reference/android/icu/util/Calendar.html
  Time: { label: 時間, command: date, option: "HH:mm:ss" } #時間： date 格式
  TrimeApp: { label: 同文, command: run, option: "com.osfans.trime" } #運行程序: run 包名
  TrimeCmp: {
      label: 同文組件,
      command: run,
      option: "com.osfans.trime/.ui.main.MainActivity",
    } #運行程序指定組件: run 包名/組件名
  Homepage: {
      label: 同文主頁,
      command: run,
      option: "https://github.com/osfans/trime",
    } #查看網頁: run 網址
  CommitHomepage: { label: 同文網址, commit: https://github.com/osfans/trime } #直接上屏
  Wiki: {
      label: 維基,
      command: run,
      option: "https://zh.wikipedia.org/wiki/%s",
    } #搜索網頁: %s或者%1$s爲當前字符
  Google: {
      label: 谷歌,
      command: run,
      option: "https://www.google.com/search?q=%s",
    } #搜索網頁: %s或者%1$s爲當前字符
  MoeDict: { label: 萌典, command: run, option: "https://www.moedict.tw/%3$s" } #搜索網頁: %3$s爲光標前字符
  Baidu: {
      label: 百度搜索,
      command: run,
      option: "https://www.baidu.com/s?wd=%4$s",
    } #搜索網頁: %4s爲光標前所有字符
  Zdic: {
      label: 漢典,
      command: run,
      option: "http://www.zdic.net/sousuo/?q=%1$s",
    } #搜索網頁: %s或者%1$s爲當前字符
  Zdic2: {
      label: 漢典,
      command: run,
      option: "http://www.zdic.net/sousuo/?q=%2$s",
    } #搜索網頁: %2$s爲當前輸入的編碼
  WebSearch: { label: 搜索網頁, command: web_search, option: "%4$s" } #搜索，其他view、dial、edit、search等intent，參考安卓的intent文檔：https://developer.android.com/reference/android/content/Intent.html
  Search: { label: 搜索, command: search, option: "%1$s" } #搜索短信、字典等
  Share: { label: 分享, command: send, option: "%s" } #分享指定文本: %s或者%1$s爲當前字符
  Deploy: { label: 部署, send: FUNCTION, command: apply, option: "DEPLOY" } #重新部署
  Sync: {
      label: 同步,
      send: FUNCTION,
      command: apply,
      option: "SYNC_USER_DATA",
    } #用户资料同步
  updateConfig: {
      label: 更新配置,
      send: FUNCTION,
      command: apply,
      option: "UPDATE_CONFIG",
    } #更新配置文件
