tool_bar:
  button_spacing: 5 # 其他按键水平间隙
  button_font: [iconfont.ttf, ss.ttf] # 按键字体设置
  back_style: ic@menu_left # 左侧返回按钮样式

  # 主按键
  primary_button:
    # 背景样式
    background:
      type: circle # 按键高亮形状类型。可选值：rectangle（默认）、circle
      corner_radius: 10 # 按键圆角
      bg_normal: b_primary_button # 一般状态下按键背景配色
      bg_hightlight: hb_primary_button # 按下状态下按键背景配色
      vertical_inset: 4 # 垂直方向上按键背景内距（距离上下两侧边框距离）
      horizontal_inset: 4 # 垂直方向上按键背景内距（距离左右两侧边框距离）
    # 前景样式
    foreground:
      style: ic@dots_horizontal # 按键图标样式
      fg_normal: f_primary_button # 一般状态下按键前景配色
      fg_highlight: hf_primary_button # 按下状态下按键前景配色
      padding: 10 # 按键内距（距离上下左右边框距离）
    # 按钮点击事件
    action: menu_keyboard
    long_press_action: Settings

  hide_button: &hide_button
    background:
      bg_normal: b_button
      bg_hightlight: hb_button
    foreground:
      style: "\uE0D0"
      fg_normal: f_button
      fg_hightlight: hf_button
    action: Hide

  emoji_button: &emoji_button
    background:
      bg_normal: b_button
      bg_hightlight: hb_button
    foreground:
      style: ic@emoticon_outline
      fg_normal: f_button
      fg_hightlight: hf_button
    action: liquid_keyboard_emoji

  clipboard_button: &clipboard_button
    background:
      bg_normal: b_button
      bg_hightlight: hb_button
    foreground:
      style: ic@clipboard_text_outline
      fg_normal: f_button
      fg_hightlight: hf_button
    action: clipboard_window

  edit_button: &edit_button
    background:
      bg_normal: b_button
      bg_hightlight: hb_button
    foreground:
      style: "\uE1C1"
      fg_normal: f_button
      fg_hightlight: hf_button
      font_size: 20
    action: Keyboard_editor

  full_shape_button: &full_shape_button
    background:
      bg_normal: b_button
      bg_hightlight: hb_button
    foreground:
      option_styles: [ic@moon_new, ic@moon_full]
      fg_normal: f_button
      fg_hightlight: hf_button
    action: Zenkaku_Hankaku

  redo_button: &redo_button
    background:
      bg_normal: b_button
      bg_hightlight: hb_button
    foreground:
      style: ic@redo
      fg_normal: f_button
      fg_hightlight: hf_button
      font_size: 14
    action: redo

  undo_button: &undo_button
    background:
      bg_normal: b_button
      bg_hightlight: hb_button
    foreground:
      style: ic@undo
      fg_normal: f_button
      fg_hightlight: hf_button
      font_size: 14
    action: undo

  # 右侧按钮列表（从右向左排列）
  buttons:
    [
      *hide_button,
      *emoji_button,
      *clipboard_button,
      *edit_button,
      *full_shape_button,
      *redo_button,
      *undo_button,
    ]

preset_keys:
  # 工具栏
  menu_keyboard: { send: FUNCTION, command: menu_keyboard }
  undo: { send: Control+z }
  redo: { send: Control+Shift+z }
  Keyboard_editor: { send: Eisu_toggle, select: editor }
  Hide: { send: BACK }
  # 编辑
  Tab: { label: ic@keyboard_tab, send: Tab }
  Tab_Reverse: { label: ic@keyboard_tab_reverse, send: Shift+Tab }
  Shift_L: { label: ic@arrow_up_bold_outline, preview: "", send: "" }
  Caps:
    {
      label: ic@apple_keyboard_shift,
      send: Eisu_toggle,
      preview: "",
      select: caps,
    }
  BackSpace: { label: ⌫, preview: "", repeatable: true, send: BackSpace }
  BackSpace_Word: { send: Control+BackSpace }
  Delete: { label: ⌦, send: Delete }
  Return: { label: enter_labels, preview: "", send: Return }
  Space:
    {
      label: ic@keyboard_space,
      preview: "",
      repeatable: false,
      slide_cursor: true,
      send: space,
    }
  Escape: { label: Esc, send: ic@keyboard_esc }
  Left: { label: "←", send: Left }
  Down: { label: "↓", send: Down }
  Up: { label: "↑", send: Up }
  Right: { label: "→", send: Right }
  select_all: { label: ic@select_all, send: Control+a }
  cut: { label: ic@content_cut, send: Control+x }
  copy: { label: ic@content_copy, send: Control+c }
  paste: { label: ic@content_paste, send: Control+v }
  # rime組合鍵
  F4: { label: 方案選單, send: F4 }
  BackToPreviousSyllable: { label: 刪音節, send: Control+BackSpace }
  CommitRawInput: { label: 編碼, send: Control+Return }
  CommitScriptText: { label: 編碼, send: Shift+Return }
  CommitComment: { label: 編碼, send: Control+Shift+Return }
  DeleteCandidate: { label: 刪詞, send: Control+Delete }
  # rime狀態
  Mode_switch:
    {
      label: ic@web,
      preview: "",
      toggle: ascii_mode,
      send: SWITCH_CHARSET,
      states: [中, 英],
    }
  Zenkaku_Hankaku:
    { toggle: full_shape, send: SWITCH_CHARSET, states: [半角, 全角] }
  Henkan: { toggle: simplification, send: SWITCH_CHARSET, states: [漢字, 汉字] }
  Charset_switch:
    { toggle: extended_charset, send: SWITCH_CHARSET, states: [常用, 增廣] }
  Punct_switch:
    { toggle: ascii_punct, send: SWITCH_CHARSET, states: [。，, ．，] }
  #切换键盘
  Keyboard_number:
    { label: ic@numeric, preview: "", send: Eisu_toggle, select: number }
  Keyboard_letter: { preview: "", send: Eisu_toggle, select: letter }
  Keyboard_letter_caps: { preview: "", send: Eisu_toggle, select: letter_caps }
  Keyboard_default:
    { label: 返回, preview: "", send: Eisu_toggle, select: .default }
  Keyboard_default1:
    { label: 英, preview: "", send: Eisu_toggle, select: .default }
  Keyboard_default2:
    {
      label: ic@apple_keyboard_caps,
      preview: "",
      send: Eisu_toggle,
      select: .default,
    }
  Keyboard_switch: { label: ic@web, send: Eisu_toggle, select: .next }
  liquid_keyboard_switch:
    { label: 更多, send: FUNCTION, command: liquid_keyboard, option: "更多" }
  liquid_keyboard_exit: {
      label: 返回,
      send: FUNCTION,
      command: liquid_keyboard,
      option: "-1",
    } #退出liquidkeyboard
  liquid_keyboard_emoji:
    { label: 🙂, send: FUNCTION, command: liquid_keyboard, option: "emoji" }
  clipboard_window: {
      label: "剪贴",
      send: FUNCTION,
      command: "clipboard_window",
      option: "0",
    } #0剪贴板，1收藏夹
  # trime設定
  IME_switch: { send: LANGUAGE_SWITCH } #彈出對話框選擇輸入法
  IME_last: { label: 上一輸入法, send: LANGUAGE_SWITCH, select: .last } #直接切換到上一輸入法
  IME_next: { label: 下一輸入法, send: LANGUAGE_SWITCH, select: .next } #直接切換到下一輸入法
  Schema_switch: { label: 下一方案, send: Control+Shift+1 }
  Menu: { label: 方案, preview: "", send: MENU }
  Settings: { label: 設定, send: SETTINGS }
  Schema_settings: { label: 方案, send: SETTINGS, option: "schema" }
  ẑ_key: { label: ẑ, preview: ẑ, send: "1" }
  ĉ_key: { label: ĉ, preview: ĉ, send: "2" }
  ŝ_key: { label: ŝ, preview: ŝ, send: "3" }
  ñ_key: { label: ñ, preview: ñ, send: "9" }
  ŋ_key: { label: ŋ, preview: ŋ, send: "0" }
  Tone_1: { label: "-", preview: "-", send: "4" }
  Tone_2: { label: "/", preview: "/", send: "5" }
  Tone_3: { label: "|", preview: "|", send: "6" }
  Tone_4: { label: "\\", preview: "\\", send: "7" }
  Variant: { label: "_", preview: "_", send: "8" }
