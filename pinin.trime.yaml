# Trime default style settings
# encoding: utf-8

config_version: "3.0"
name: Pinin
author: ASneka

size:
  1: &candidate_text_size 18 # 候选字号
  2: &key_long_text_size 14 #长标签字号
  3: &key_text_size 22 # 键字号

height:
  kbh: &kbh 200
  1: &jpgd1 30 # 表情键盘
  2: &jpgd2 24 # 颜文字键盘1
  3: &jpgd3 24 # 颜文字键盘2
  5: &jpgd5 39.5 # 符号键盘
  6: &hgap 1 # 键盘横缝大小
  7: &sgap 1 # 键盘竖缝大小

round_corner:
  1: &round1 8 # 按键圆角半径
  2: &round2 0 # 候选窗口圆角
  3: &round3 12 # 回车键圆角

# 界面风格、功能开关
style:
  ### 功能
  auto_caps: false # 自动句首大写（true:打开;false:关闭;ascii:仅英文模式句首大写）
  candidate_use_cursor: false # 候选焦点高亮（true:打开;false:关闭）
  comment_on_top: false # 候选项注释在上方或右侧 （true:在上方；false:在右侧）
  horizontal: true # 水平模式。改变方向键的功能 （true：方向键适配横排候选；false：方向键适配竖排候选）
  keyboards: [.default, letter, number, edit, numberb] # 键盘配置。除主键盘外，其它需要用到的键盘都要在这里声明。
  proximity_correction: false # 将按键之间的空白区域分配给相邻的按键，避免空按（true:打开；false:关闭）
  # background_folder: # 背景图路径，即保存在 background 的哪个子目录。 使用此参数可以方便管理多个主题的图片（当然也可以指定多个主题共用一套图片）。
  reset_ascii_mode: true # 不同进程中显示键盘时重置为中文状态（true:重置为中文；false:记忆中英状态）
  reset_ascii_mode_on_focus_change: true # 焦点变更弹起输入法软键盘时，重置 ascii_mode
  enter_label_mode: 0 # 是否使用App提供的ActionLabel内容作为Enter键的文本（由于多数App没有适配ActionLable，实际影响不大）。0不使用，1只使用actionlabel，2优先使用，3当其他方式没有获得label时才读取actionlabel
  enter_labels: # 定义Enter键的文本
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    search: 搜索
    send: 发送
    default: ↩ # 定义默认Enter键的文本

  ### 字体
  text_font: latin.ttf # 编码字体
  candidate_font: han.ttf # 候选字体
  comment_font: comment.ttf # 候选注释字体
  hanb_font: hanb.ttf # 后备字体。用于补充候选字体（candidate_font）。
  latin_font: latin.ttf # 候选及候选注释拉丁字体 ※ 当latin_font生效时，拉丁字符（< 0x2e80）就不再由comment_font和candidate_font控制
  key_font: symbol.ttf # 按键字体（click）
  symbol_font: symbol.ttf # 符号字体（long_click 和 hint）
  popup_font: latin.ttf # 按键提示字体

  ### 尺寸
  candidate_border: 0 # 候选区域边框宽度
  candidate_border_round: 0 # 候选区域边框圆角半径
  candidate_padding: 5 # 候选项内边距（影响候选项的间距）
  candidate_spacing: 0.0 # 候选分割线宽度
  candidate_text_size: *candidate_text_size # 候选字大小
  candidate_text_vertical_bias: 1.0 # 候选文本垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  candidate_view_height: 28 # 候选区高度
  candidate_corner_radius: 5 # 候选圆角
  comment_text_size: 10 # 候选注释大小
  comment_height: 12 # 候选注释区高度=
  comment_position: right # 编码提示布局位置：right / top / overlay
  comment_vertical_bias: 0.0 # 编码提示垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  key_border: 1 # 按键边框宽度
  key_text_size: *key_text_size # 按键文本大小（click）
  key_long_text_size: *key_long_text_size # 按键长文本大小（字数 ≥2）
  symbol_text_size: 10 # 符号大小（long_click 和 hint）
  round_corner: *round1 # 按键圆角半径
  popup_width: 38 # 按键提示宽度
  popup_height: 48 # 按键提示高度
  popup_bottom_margin: 68 # 按键提示底边距
  popup_key_height: 48 # 按键提示内键高度
  popup_text_size: 23 # 按键提示字号
  shadow_radius: 0.0 # 键盘字体阴影大小（数值不宜过大，可能会造成卡顿）
  horizontal_gap: *hgap #键水平间距
  vertical_gap: *sgap #键盘行距
  # ⚠ 若关闭了proximity_correction，过大的horizontal_gap与vertical_gap会引起空按漏按
  vertical_correction: 0 # 触摸位置校正（竖直方向）。 ※ 为了提升打字手感，可将按键的实际触摸位置相对其显示位置上下偏移一点点（默认值-10，上偏为正，下偏为负，为0则不偏移）。
  keyboard_padding: 0 # 竖屏模式下，屏幕左右两侧与键盘的距离（减少曲面屏误触）
  keyboard_padding_bottom: 0 # 竖屏模式下，屏幕下边缘与键盘的距离（减少全面屏误触）
  keyboard_padding_land: 0 # 横屏模式下，屏幕左右两侧与键盘的距离（避免横屏按键过度拉伸变形）
  keyboard_padding_land_bottom: 0 # 横屏模式下，屏幕下边缘与键盘的距离
  keyboard_height: *kbh # 键盘锁定的高度。当每行按键高度、行之间间距之和与此参数存在差异时，键盘自动缩放为锁定的高度。使用此参数可以快速调整键盘高度而无需复杂。当缺少此参数时，键盘高度不做缩放计算。
  keyboard_height_land: 200 # 横屏下键盘锁定的高度，同上

preedit: # 预编辑文本视图参数
  horizontal_padding: 8 # 横向内边距（整数）
  #  alpha: 0.8                 # 透明度（0-1，浮点）
  top_start_radius: 4 # 始上端圆角（浮点）
  top_end_radius: 4 # 末上端圆角（浮点）
  foreground: # 前景样式
    font_size: 16 # 预编辑字体大小（浮点）

# 最好保留一项，防止其他主题使用 __include 时无法加载
