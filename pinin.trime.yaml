liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "ASneka"
  single_width: 60 # single类型的按键宽度
  margin_x: 5 # 左右按键间隙的1/2
  fixed_key_bar: # 固定按键条
    position: bottom # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys: # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - space1
      - BackSpace
      - Return2
      - clipboard_window
      - liquid_keyboard_switch
  keyboards:
    [
      tabs,
      history,
      emoji,
      math,
      ascii,
      cn,
      symbollist,
      list,
      ids,
      symbol,
      pinyin,
      script_symbols,
      jp,
      grease,
      rusa,
      korea,
      lation,
      yinbiao,
      unit,
      yanwenzi,
      combing,
      emoji_full,
    ]
  #tab列表
  tabs:
    name: 更多
    type: TABS
  history:
    name: 常用
    type: HISTORY
  emoji:
    type: SINGLE
    keys: "🙂"
  emoji_full:
    type: SINGLE
    name: 全emoji
    keys: "😀"
  math: #tab名称
    type: SINGLE
    name: 数学
    keys: "≈＝≠≌<>≤≥≡()[]{}-+±×*/÷&∥%‰‱°′″∫∮∯∬∭∰∞∑∧∏∈∵∴⊥∝∨∪•√〒∝∽∈∩∧⊙⌒∥∟∣∂∆∞≌∉∪∨⊕⊿⊥∠∫∬∭" #tab中的按键列表
