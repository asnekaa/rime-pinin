preset_color_schemes:
  default:
    name: Pinin_light
    author: ASneka
    dark_scheme: pinin_dark

    # 编码区
    text_back_color: *pl_back
    text_color: *pl_t
    hilited_back_color: *pl_back
    hilited_text_color: *pl_ht

    # 候选项
    back_color: *pl_back
    candidate_text_color: *pl_ht
    hilited_candidate_back_color: *pl_hc_b
    hilited_candidate_text_color: *pl_ht

    # 工具栏
    b_primary_button: *pl_back
    f_primary_button: *pl_ht
    hb_primary_button: *pl_hpb_b
    hf_primary_button: *pl_ht

    b_button: *pl_back
