patch:
  # 开关
  # reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
  # states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
  # abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
  switches:
    - name: ascii_mode
      states: [中, Ａ]
    - name: ascii_punct # 中英标点
      states: [¥, $]
    - name: traditionalization
      states: [简, 繁]
    - name: full_shape
      states: ["", ""]
      reset: 1
    - name: search_single_char # search.lua 的功能开关，辅码查词时是否单字优先
      states: [正常, 单字]
      abbrev: [词, 单]

  # 输入引擎
  engine/processors/@next: lua_processor@*auto_fullshape

  emoji: null

  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase/rime-ice
    db_class: stabledb
    enable_completion: false
    enable_sentence: false

  # 拼写设定
  speller/algebra/@before 0: "derive/^([jqx])i(a|e|an|ang|ao|ai|en|eng|ong|ing|ian|iang|iao|ie|in|iong|ou|ui|un|uan|ue)$/$1$2/"
