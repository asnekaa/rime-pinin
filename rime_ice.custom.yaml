patch:
  # 开关
  # reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
  # states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
  # abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
  switches:
    - name: ascii_mode
      states: [中, Ａ]
    - name: ascii_punct # 中英标点
      states: [¥, $]
    - name: traditionalization
      states: [简, 繁]
    - name: full_shape
      states: [半角, 全角]
    - name: search_single_char # search.lua 的功能开关，辅码查词时是否单字优先
      states: [正常, 单字]
      abbrev: [词, 单]

  # Lua 配置: 日期、时间、星期、ISO 8601、时间戳的触发关键字
  date_translator:
    date: date
    time: time
    week: week
    datetime: dt
    timestamp: ts
    datezh: datezh
    dateen: dateen

  lunar: lunar

  # Lua 配置: 置顶候选项
  # 注释太长了，请参考 pin_cand_filter.lua 开头的说明书。
  # pin_cand_filter.lua 末尾有常见编码可供直接复制参考
  pin_cand_filter:
    # 格式：编码<Tab>字词1<Space>字词2……
    null

  # 主翻译器，拼音
  # preedit_format 影响到输入框的显示和“Shift+回车”上屏的字符
  translator/preedit_format:
    - xform/(?<=[A-Z])\s(?=[A-Z])// # 消除大写字母之间的空格

  # 自定义短语：custom_phrase/rime-ice.txt
  custom_phrase/user_dict: custom_phrase/rime-ice

  # Emoji
  emoji: null

  # 拼写设定
  speller/algebra/:
    # 展开缩写韵母
    - xform/iu$/iou/
    - xform/ui$/uei/
    - xform/^yong$/yüng/
    - xform/iong$/üng/
    - xform/ong$/ung/

    # y 起始音节去除 i
    - xform/^yin$/yn/
    - xform/^ying$/yng/

    # 统一 ü 的编码
    - xform/^([jqxy])[uv]/$1ü/
    - xform/^([nl])v$/$1ü/
    - xform/^([nl])[uv]e$/$1üe/

    # 去除隔音字母 y/w，并将 ü 转为 y
    - xform/^y([^ü])/i$1/
    - xform/^wen$/wn/
    - xform/^w/u/
    - xform/^yü$/yüü/
    - xform/^yü/ü/
    - xform/ü/y/

    # j/q/x/y 后的 i/y 独立编码
    - xform/^([jqxy])i$/$1ii/
    - xform/^([jqx])y$/$1yy/

    # 补充编码变体
    - derive/^er$/a/
    - derive/^er$/ar/
    - derive/^([bpmf])o$/$1uo/
    - derive/uo$/o/
    - derive/^([bpmf])eng$/$1ung/
    - derive/^([dtnlgkhzcsr]|zh|ch|sh)eng$/$1en/

    # 翘舌声母重新编码
    - xform/^zh/j/
    - xform/^ch/q/
    - xform/^sh/x/

    # 空韵
    - xform/^([jqxzcsr])i$/$1h/

    # 压缩复合韵母
    - xform/iao$/io/
    - xform/iou$/iu/
    - xform/ing$/ig/
    - xform/uai$/ui/
    - xform/uei$/ue/
    - xform/ung$/ug/
    - xform/yng$/yg/

    # 压缩 an/ang/en/eng
    - xform/an$/w/
    - xform/ang$/v/
    - xform/^(.+)en$/$1n/
    - xform/^(.+)eng$/$1g/

    # 超级简拼
    - abbrev/^([b-ik-pr-wyz]).+$/$1/
    - abbrev/^en$/n/
    - abbrev/^eng$/g/
    - erase/^en$/
    - erase/^eng$/
    - abbrev/^([jxq])[^iy].+$/$1/
    - abbrev/^([jqx][iy]).+$/$1/
