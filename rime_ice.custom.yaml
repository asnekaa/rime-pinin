patch:
  # 开关
  # reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
  # states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
  # abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
  switches:
    - name: ascii_mode
      states: [中, Ａ]
    - name: ascii_punct # 中英标点
      states: [¥, $]
    - name: traditionalization
      states: [简, 繁]
    - name: full_shape
      states: [半角, 全角]
    - name: search_single_char # search.lua 的功能开关，辅码查词时是否单字优先
      states: [正常, 单字]
      abbrev: [词, 单]

  # Lua 配置: 日期、时间、星期、ISO 8601、时间戳的触发关键字
  date_translator:
    date: date
    time: time
    week: week
    datetime: dt
    timestamp: ts
    datezh: datezh
    dateen: dateen

  lunar: lunar

  # Lua 配置: 置顶候选项
  # 注释太长了，请参考 pin_cand_filter.lua 开头的说明书。
  # pin_cand_filter.lua 末尾有常见编码可供直接复制参考
  pin_cand_filter:
    # 格式：编码<Tab>字词1<Space>字词2……
    null

  # 主翻译器，拼音
  # preedit_format 影响到输入框的显示和“Shift+回车”上屏的字符
  translator/preedit_format:
    - xform/(?<=[A-Z])\s(?=[A-Z])// # 消除大写字母之间的空格

  # 自定义短语：custom_phrase/rime-ice.txt
  custom_phrase/user_dict: custom_phrase/rime-ice

  # Emoji
  emoji: null

  # 拼写设定
  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`1234567890
  speller/algebra:
    # y 起始音节去除 i
    - xform/^yi$/y/
    - xform/^yin$/yn/
    - xform/^ying$/yng/

    # w 起始音节去除 u
    - xform/^wu$/w/

    # 统一 ü 编码
    - xform/^([jqxy])[uv]/$1ü/
    - xform/^([nl])v$/$1ü/
    - xform/^([nl])[uv]e$/$1üe/

    # 改为正确介母
    - xform/^yong$/yüng/
    - xform/iong$/üng/
    - xform/ong$/ung/
    - xform/^yo$/yüo/

    # 去除隔音字母 y/w，并将 ü 转为 y
    - xform/^y$/i/
    - xform/^y([^ü])/i$1/
    - xform/^w/u/
    - xform/^yü/ü/
    - xform/ü/y/

    # 展开缩写韵母
    - xform/iu$/iou/
    - xform/ui$/uei/
    - xform/([iuy])n$/$1en/
    - xform/([iuy])ng$/$1eng/

    # 空韵编码
    - xform/^([zcsr]|zh|ch|sh)i$/$1h/

    # 翘舌声母重新编码
    - xform/^zh(.+)/j$1/
    - xform/^ch(.+)/q$1/
    - xform/^sh(.+)/x$1/

    # 转换为实际发音形式
    - derive/^er$/ar/
    - derive/uo$/o/
    - xform/^([bpmf])eng$/$1ueng/
    - xform/^([dtnlgkhjqxzcsr])eng$/$1en/
    - xform/ieng$/ien/

    # 压缩复合韵母
    - xform/iao$/io/
    - xform/iou$/iu/
    - xform/uai$/ui/
    - xform/uei$/ue/

    # 压缩鼻音韵母
    - xform/an$/w/
    - xform/ang$/v/
    - xform/^(.+)en$/$1n/
    - xform/^(.+)eng$/$1g/

    # 超级简拼
    - abbrev/^([b-hj-tvwxz]).+$/$1/
    - abbrev/^en$/n/
    - abbrev/^eng$/g/
    - erase/^en$/
    - erase/^eng$/
