patch:
  # 开关
  # reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
  # states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
  # abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
  switches:
    - name: ascii_mode
      states: [中, Ａ]
    - name: ascii_punct # 中英标点
      states: [¥, $]
    - name: traditionalization
      states: [简, 繁]
    - name: full_shape
      states: [半角, 全角]
    - name: search_single_char # search.lua 的功能开关，辅码查词时是否单字优先
      states: [正常, 单字]
      abbrev: [词, 单]

  # 输入引擎
  engine/processors/@before 0: lua_processor@*pinin.tone_symbol
  engine/processors/@before 1: lua_processor@*pinin.input_recorder
  engine/filters/@before 0: lua_filter@*pinin.custom_phrase_marker

  # Lua 配置: 日期、时间、星期、ISO 8601、时间戳的触发关键字
  date_translator:
    date: date
    time: time
    week: week
    datetime: dt
    timestamp: ts
    datezh: datezh
    dateen: dateen

  lunar: lunar

  # Lua 配置: 置顶候选项
  # 注释太长了，请参考 pin_cand_filter.lua 开头的说明书。
  # pin_cand_filter.lua 末尾有常见编码可供直接复制参考
  pin_cand_filter:
    # 格式：编码<Tab>字词1<Space>字词2……
    null

  # 主翻译器，拼音
  # 挂载词库 pinin.dict.yaml
  translator/dictionary: pinin
  # preedit_format 影响到输入框的显示和“Shift+回车”上屏的字符
  translator/preedit_format:
    - xform/(?<=[A-Z])\s(?=[A-Z])// # 消除大写字母之间的空格

  # 自定义短语：custom_phrase/rime-ice.txt
  custom_phrase/user_dict: custom_phrase/rime-ice

  # Emoji
  emoji: null

  # 拼写设定
  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`1234567890－／｜＼・＿￣
  speller/algebra:
    # 一个音节最多由三部分构成：声母 + 介母 + 韵母
    # 声母：b p m f d t n l g k h j q x z c s r
    # 介母：iuy
    # 韵母：
    #  单韵母：a o e
    #  复韵母：ai ei ao ou
    #  鼻韵母：w v n g

    # # y 起始音节去除 i
    # - xform/^yi$/y/
    # - xform/^yin$/yn/
    # - xform/^ying$/yng/

    # # w 起始音节去除 u
    # - xform/^wu$/w/

    # # 统一 ü 编码
    # - xform/^([jqxy])[uv]/$1ü/
    # - xform/^([nl])v$/$1ü/
    # - xform/^([nl])[uv]e$/$1üe/

    # # 修正介母
    # - xform/^yong$/yüng/
    # - xform/iong$/üng/
    # - xform/ong$/ung/
    # - xform/^yo$/yüo/

    # # 去除隔音字母 y/w，并将 ü 转为 y
    # - xform/^y$/i/
    # - xform/^y([^ü])/i$1/
    # - xform/^w/u/
    # - xform/^yü/ü/
    # - xform/ü/y/

    # # 展开缩写韵母
    # - xform/iu$/iou/
    # - xform/ui$/uei/

    # # 修改单韵母编码
    # - xform/an$/w/
    # - xform/ang$/v/
    # - xform/^(.+)en$/$1n/
    # - xform/^(.+)eng$/$1ng/
    # - xform/^(.+)ng$/$1g/

    # # 空韵重新编码
    # - xform/^([zcsr]|zh|ch|sh)i$/$1/

    # # 翘舌声母重新编码
    # - xform/^zh/j/
    # - xform/^ch/q/
    # - xform/^sh/x/

    # # 压缩介韵
    # - xform/uo$/o/
    # - xform/uai$/ui/
    # - xform/uei$/ue/
    # - xform/iao$/io/
    # - xform/iou$/iu/

    - xlit/①②③④⑤/－／｜＼・/

    # 补充额外编码
    - derive/^er$/ar/
    - derive/o$/uo/
    - derive/^([bpmf])g$/$1ug/
    - derive/^([dtnlgkhjqxzcsr])g$/$1n/
    - derive/ig$/in/

    # 超级简拼
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([a-z]).+(－|／|｜|＼|・)$/$1$2/
