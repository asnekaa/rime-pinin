patch:
  schema/dependencies:
    - kagiroi_romaji
    - kagiroi_kanji
    - kagiroi_matrix

  switches:
    - name: ascii_mode
      reset: 0
      states: [あ, 英字]
    - options: [hiragana, katakana, hw_katakana]
      reset: 0
      states: [ひらがな, カタカナ, ｶﾀｶﾅ]
    - name: full_shape
      states: [半角, 全角]
    - name: ascii_punct
      states: [。，, ．，]

  custom_phrase/user_dict: custom_phrase/kagiroi

  emoji: null
