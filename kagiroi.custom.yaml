patch:
  switches:
    - name: ascii_mode
      reset: 0
      states: [あ, 英字]
    - options: [hiragana, katakana, hw_katakana]
      reset: 0
      states: [ひらがな, カタカナ, ｶﾀｶﾅ]
    - name: full_shape
      states: [半角, 全角]
    - name: ascii_punct
      states: [。，, ．，]

  emoji: null

  custom_phrase/user_dict: custom_phrase/kagiroi
